# Redis + the korailbot CLI image.
#
#   docker compose up -d redis                       # Redis only (CLI runs on the host)
#   docker compose run --rm bot login                # CLI inside a container
#   docker compose run --rm -d bot start --date ...  # worker keeps running in a detached container
#
# Korail blocks data-center/VPN IPs, so run this on a home network.
services:
  bot:
    build: .
    image: korailbot:local
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - bot_data:/data
    depends_on:
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - korail_network

  redis:
    image: redis:7-alpine
    container_name: korail_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1000
      --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - korail_network

volumes:
  redis_data:
    driver: local
  bot_data:
    driver: local

networks:
  korail_network:
    driver: bridge
